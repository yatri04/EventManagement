<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Swap Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="text-white">
    <!-- Navigation -->
    <nav class="glass p-4 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">SkillSwap</h1>
            <div class="flex space-x-4">
                <button onclick="goToHome()" class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-700">Home</button>
                <button onclick="goToProfile()" class="px-4 py-2 bg-green-600 rounded-lg hover:bg-green-700">Profile</button>
                <button onclick="goToLogin()" class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700">Login</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2">Swap Requests</h2>
            <p class="text-gray-300">Manage your skill swap requests and responses</p>
        </div>

        <!-- Swap Requests Container -->
        <div id="swapRequestsContainer" class="space-y-4">
            <!-- Requests will be loaded here by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

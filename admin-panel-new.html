<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orbitron {
            font-family: 'Orbitron', monospace;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Neon Effects */
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5), 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(0, 212, 255, 0.6);
        }

        /* Custom Button */
        .cyber-button {
            position: relative;
            background: linear-gradient(45deg, #00d4ff, #ff6b6b);
            border: none;
            color: white;
            padding: 12px 24px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            border-radius: 8px;
            font-size: 14px;
        }

        .cyber-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .cyber-button:hover::before {
            left: 100%;
        }

        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .cyber-button.danger {
            background: linear-gradient(45deg, #dc3545, #ff6b6b);
        }

        .cyber-button.success {
            background: linear-gradient(45deg, #28a745, #20c997);
        }

        /* Form Input */
        .form-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Form Select */
        .form-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .form-select option {
            background: #1a1a2e;
            color: white;
        }

        /* Table Styles */
        .admin-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        .admin-table th {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .admin-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .admin-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Status Badges */
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-open {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .status-full {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .status-closed {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        /* Loading Animation */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #00d4ff;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left-color: #28a745;
        }

        .toast.error {
            border-left-color: #dc3545;
        }

        /* Stats Cards */
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass fixed top-0 left-0 right-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <div class="orbitron text-2xl font-bold neon-text">
                    <span class="text-cyan-400">Event</span><span class="text-pink-400">Registration</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="createEvent()" class="cyber-button success">
                    <i class="fas fa-plus mr-2"></i>Create Event
                </button>
                <button onclick="logout()" class="cyber-button danger">
                    <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-20 p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="stat-card">
                    <div class="stat-number" id="totalEvents">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">Total Students</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeEvents">0</div>
                    <div class="stat-label">Active Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalRegistrations">0</div>
                    <div class="stat-label">Total Registrations</div>
                </div>
            </div>

            <!-- Events Table -->
            <div class="glass rounded-3xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-white">Events Management</h2>
                    <button onclick="loadEvents()" class="cyber-button">
                        <i class="fas fa-refresh mr-2"></i>Refresh
                    </button>
                </div>

                <div class="admin-table">
                    <table class="w-full">
                        <thead>
                            <tr>
                                <th>Event Name</th>
                                <th>Date</th>
                                <th>Capacity</th>
                                <th>Registered</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody">
                            <!-- Events will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Event Modal -->
    <div id="createEventModal" class="modal">
        <div class="modal-content w-full max-w-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-white">Create New Event</h3>
                <button onclick="closeModal()" class="text-white/60 hover:text-white text-2xl">&times;</button>
            </div>

            <form id="createEventForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Event Name</label>
                        <input type="text" id="eventName" class="form-input" placeholder="Enter event name" required>
                    </div>
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Organizer</label>
                        <input type="text" id="organizer" class="form-input" placeholder="Enter organizer name" required>
                    </div>
                </div>

                <div>
                    <label class="block text-white text-sm font-semibold mb-2">Description</label>
                    <textarea id="description" class="form-input" rows="3" placeholder="Enter event description"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Date</label>
                        <input type="datetime-local" id="eventDate" class="form-input" required>
                    </div>
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Capacity</label>
                        <input type="number" id="capacity" class="form-input" placeholder="Max participants" required>
                    </div>
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Location</label>
                        <input type="text" id="location" class="form-input" placeholder="Event location">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Organizer Email</label>
                        <input type="email" id="organizerEmail" class="form-input" placeholder="organizer@email.com" required>
                    </div>
                    <div>
                        <label class="block text-white text-sm font-semibold mb-2">Registration Deadline</label>
                        <input type="datetime-local" id="registrationDeadline" class="form-input">
                    </div>
                </div>

                <div>
                    <label class="block text-white text-sm font-semibold mb-2">Tags (comma separated)</label>
                    <input type="text" id="tags" class="form-input" placeholder="Technology, Workshop, Conference">
                </div>

                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="closeModal()" class="cyber-button danger">Cancel</button>
                    <button type="submit" class="cyber-button success">
                        <span id="createEventText">Create Event</span>
                        <div id="createEventSpinner" class="loading-spinner hidden"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="flex items-center">
            <i id="toastIcon" class="fas fa-info-circle mr-2"></i>
            <span id="toastMessage">Message</span>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        let currentUser = null;

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadDashboard();
            loadEvents();
        });

        // Check if user is authenticated and is admin
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('currentUser');
            
            if (!token || !userData) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = JSON.parse(userData);
            
            if (!currentUser.isAdmin) {
                showToast('Access denied. Admin privileges required.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }
        }

        // Load dashboard statistics
        async function loadDashboard() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/dashboard`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalEvents').textContent = data.data.statistics.totalEvents;
                    document.getElementById('totalStudents').textContent = data.data.statistics.totalStudents;
                    document.getElementById('activeEvents').textContent = data.data.statistics.activeEvents;
                    document.getElementById('totalRegistrations').textContent = data.data.statistics.totalStudents; // Placeholder
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Load events
        async function loadEvents() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/events`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    renderEventsTable(data.data.events);
                } else {
                    showToast(data.message || 'Failed to load events', 'error');
                }
            } catch (error) {
                console.error('Error loading events:', error);
                showToast('Error loading events', 'error');
            }
        }

        // Render events table
        function renderEventsTable(events) {
            const tbody = document.getElementById('eventsTableBody');
            
            if (events.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-white/60 py-8">
                            No events found. Create your first event!
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = events.map(event => `
                <tr>
                    <td class="font-semibold">${event.eventName}</td>
                    <td>${new Date(event.date).toLocaleDateString()}</td>
                    <td>${event.capacity}</td>
                    <td>${event.registeredCount || 0}</td>
                    <td>
                        <span class="status-badge status-${event.registrationStatus}">
                            ${event.registrationStatus}
                        </span>
                    </td>
                    <td>
                        <button onclick="viewEventDetails('${event._id}')" class="cyber-button mr-2">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button onclick="editEvent('${event._id}')" class="cyber-button success mr-2">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteEvent('${event._id}')" class="cyber-button danger">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Create event
        function createEvent() {
            document.getElementById('createEventModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('createEventModal').classList.remove('active');
            document.getElementById('createEventForm').reset();
        }

        // Handle create event form
        document.getElementById('createEventForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                eventName: document.getElementById('eventName').value,
                description: document.getElementById('description').value,
                date: document.getElementById('eventDate').value,
                capacity: parseInt(document.getElementById('capacity').value),
                location: document.getElementById('location').value,
                organizer: document.getElementById('organizer').value,
                organizerEmail: document.getElementById('organizerEmail').value,
                registrationDeadline: document.getElementById('registrationDeadline').value,
                tags: document.getElementById('tags').value.split(',').map(tag => tag.trim()).filter(tag => tag)
            };
            
            const createBtn = document.getElementById('createEventForm').querySelector('button[type="submit"]');
            const createText = document.getElementById('createEventText');
            const createSpinner = document.getElementById('createEventSpinner');
            
            // Show loading state
            createBtn.disabled = true;
            createText.classList.add('hidden');
            createSpinner.classList.remove('hidden');
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/events`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Event created successfully!', 'success');
                    closeModal();
                    loadEvents();
                    loadDashboard();
                } else {
                    showToast(data.message || 'Failed to create event', 'error');
                }
            } catch (error) {
                console.error('Error creating event:', error);
                showToast('Error creating event', 'error');
            } finally {
                // Hide loading state
                createBtn.disabled = false;
                createText.classList.remove('hidden');
                createSpinner.classList.add('hidden');
            }
        });

        // View event details
        async function viewEventDetails(eventId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/events/${eventId}/participants`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Create modal for event details
                    const modal = document.createElement('div');
                    modal.className = 'modal active';
                    modal.innerHTML = `
                        <div class="modal-content w-full max-w-4xl">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-2xl font-bold text-white">${data.data.event.eventName} - Participants</h3>
                                <button onclick="this.closest('.modal').remove()" class="text-white/60 hover:text-white text-2xl">&times;</button>
                            </div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                                <div class="stat-card">
                                    <div class="stat-number">${data.data.participants.totalRegistered}</div>
                                    <div class="stat-label">Registered</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">${data.data.waitingList.totalWaiting}</div>
                                    <div class="stat-label">Waiting List</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number">${data.data.event.capacity}</div>
                                    <div class="stat-label">Total Capacity</div>
                                </div>
                            </div>
                            
                            <div class="admin-table">
                                <h4 class="text-lg font-semibold text-white mb-4">Registered Participants</h4>
                                <table class="w-full">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Student ID</th>
                                            <th>Department</th>
                                            <th>Registered At</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${data.data.participants.registered.map(p => `
                                            <tr>
                                                <td>${p.name}</td>
                                                <td>${p.email}</td>
                                                <td>${p.studentIdNumber || 'N/A'}</td>
                                                <td>${p.department || 'N/A'}</td>
                                                <td>${new Date(p.registeredAt).toLocaleDateString()}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    
                    document.body.appendChild(modal);
                } else {
                    showToast(data.message || 'Failed to load event details', 'error');
                }
            } catch (error) {
                console.error('Error loading event details:', error);
                showToast('Error loading event details', 'error');
            }
        }

        // Edit event (placeholder)
        function editEvent(eventId) {
            showToast('Edit functionality coming soon!', 'success');
        }

        // Delete event
        async function deleteEvent(eventId) {
            if (!confirm('Are you sure you want to delete this event?')) {
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/events/${eventId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('Event deleted successfully!', 'success');
                    loadEvents();
                    loadDashboard();
                } else {
                    showToast(data.message || 'Failed to delete event', 'error');
                }
            } catch (error) {
                console.error('Error deleting event:', error);
                showToast('Error deleting event', 'error');
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMessage.textContent = message;
            toast.className = `toast ${type}`;
            
            if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle mr-2';
            } else {
                toastIcon.className = 'fas fa-exclamation-circle mr-2';
            }
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>

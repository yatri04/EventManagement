<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .orbitron {
            font-family: 'Orbitron', monospace;
        }

        /* Holographic Profile Container */
        .holographic-profile {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 50px rgba(0, 212, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .holographic-profile::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(0, 212, 255, 0.1),
                transparent,
                rgba(255, 107, 107, 0.1),
                transparent,
                rgba(138, 43, 226, 0.1),
                transparent
            );
            animation: holographic-rotate 10s linear infinite;
            z-index: -1;
        }

        @keyframes holographic-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Profile Header */
        .profile-header {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(255, 107, 107, 0.1));
            border-radius: 25px;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #ff6b6b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .profile-avatar::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #00d4ff, #ff6b6b, #8a2be2, #00d4ff);
            border-radius: 50%;
            z-index: -1;
            animation: border-rotate 3s linear infinite;
        }

        @keyframes border-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Neon Text */
        .neon-text {
            text-shadow: 
                0 0 10px rgba(0, 212, 255, 0.8),
                0 0 20px rgba(0, 212, 255, 0.6),
                0 0 30px rgba(0, 212, 255, 0.4);
        }

        .neon-text-pink {
            text-shadow: 
                0 0 10px rgba(255, 107, 107, 0.8),
                0 0 20px rgba(255, 107, 107, 0.6),
                0 0 30px rgba(255, 107, 107, 0.4);
        }

        /* Skill Tags */
        .skill-tag {
            background: linear-gradient(45deg, #00d4ff, #ff6b6b);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            display: inline-block;
            animation: skill-pulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .skill-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .skill-tag:hover::before {
            left: 100%;
        }

        @keyframes skill-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Cyber Button */
        .cyber-button {
            background: linear-gradient(45deg, #00d4ff, #ff6b6b);
            border: none;
            color: white;
            padding: 15px 30px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .cyber-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .cyber-button:hover::before {
            left: 100%;
        }

        .cyber-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Status Badges */
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status-available {
            background: linear-gradient(45deg, #10b981, #34d399);
            color: white;
        }

        .status-busy {
            background: linear-gradient(45deg, #f59e0b, #fbbf24);
            color: white;
        }

        .status-limited {
            background: linear-gradient(45deg, #f97316, #fb923c);
            color: white;
        }

        .status-offline {
            background: linear-gradient(45deg, #ef4444, #f87171);
            color: white;
        }

        /* Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Navbar */
        .navbar {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        /* Edit Mode Styles */
        .edit-mode {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }

        .edit-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            margin: 5px 0;
        }

        .edit-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .edit-textarea {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .edit-textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Checkbox Styles */
        .skill-checkbox {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .skill-checkbox:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .skill-checkbox input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .skill-checkbox label {
            color: white;
            cursor: pointer;
        }
    </style>
</head>

                            <div class="flex space-x-2 mt-4">

                    <!-- Skills Wanted -->

    <script>
        // Profile Management
        let currentUser = null;

        function loadMyProfile() {
            currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            displayMyProfile();
        }

        function displayMyProfile() {
            // Update profile display
            document.getElementById('profileAvatar').textContent = currentUser.avatar;
            document.getElementById('profilePhoto').textContent = currentUser.avatar;
            document.getElementById('profileName').textContent = `${currentUser.firstName} ${currentUser.lastName}`;
            document.getElementById('profileTitle').textContent = currentUser.bio ? currentUser.bio.split(' ').slice(0, 3).join(' ') + '...' : 'Skill Swapper';
            
            // Load saved profile photo if it exists
            if (currentUser.photoData) {
                const photoElement = document.getElementById('profilePhoto');
                const avatarElement = document.getElementById('profileAvatar');
                
                photoElement.style.backgroundImage = `url(${currentUser.photoData})`;
                photoElement.style.backgroundSize = 'cover';
                photoElement.style.backgroundPosition = 'center';
                photoElement.textContent = '';
                
                avatarElement.style.backgroundImage = `url(${currentUser.photoData})`;
                avatarElement.style.backgroundSize = 'cover';
                avatarElement.style.backgroundPosition = 'center';
                avatarElement.textContent = '';
            }
            
            // Update status
            const statusElement = document.getElementById('profileStatus');
            if (currentUser.availability === 'available') {
                statusElement.textContent = '🟢 Available for Swaps';
                statusElement.className = 'status-badge status-available';
            } else if (currentUser.availability === 'busy') {
                statusElement.textContent = '🟡 Busy but accepting requests';
                statusElement.className = 'status-badge status-busy';
            } else if (currentUser.availability === 'limited') {
                statusElement.textContent = '🟠 Limited availability';
                statusElement.className = 'status-badge status-limited';
            } else if (currentUser.availability === 'offline') {
                statusElement.textContent = '🔴 Currently offline';
                statusElement.className = 'status-badge status-offline';
            }
            
            // Update skills offered
            updateSkillsDisplay('skillsOfferedDisplay', currentUser.skillsOffered || ['React', 'Node.js', 'Python']);
            
            // Update skills wanted
            updateSkillsDisplay('skillsWantedDisplay', currentUser.skillsWanted || ['UI/UX Design', 'Mobile Development'], true);
            
            // Update about section
            document.getElementById('aboutDisplay').innerHTML = `<p class="text-white/80 leading-relaxed">${currentUser.bio || 'Passionate about learning and sharing skills!'}</p>`;
            
            // Display swap requests
            displayMySwapRequests();
        }

        function updateSkillsDisplay(containerId, skills, isWanted = false) {
            const container = document.getElementById(containerId);
            
            if (!container) {
                return;
            }
            
            container.innerHTML = '';
            
            skills.forEach(skill => {
                const tag = document.createElement('span');
                tag.className = 'skill-tag';
                if (isWanted) {
                    tag.style.background = 'linear-gradient(45deg, #ff6b6b, #ff8e8e)';
                }
                tag.textContent = skill;
                container.appendChild(tag);
            });
        }

        // Edit functionality
        function toggleEdit(section) {
            const displayElement = document.getElementById(section === 'about' ? 'aboutDisplay' : section + 'Display');
            const editElement = document.getElementById(section === 'about' ? 'aboutEdit' : section + 'Edit');
            
            if (displayElement.style.display === 'none') {
                displayElement.style.display = 'block';
                editElement.style.display = 'none';
            } else {
                displayElement.style.display = 'none';
                editElement.style.display = 'block';
                
                // Pre-fill edit fields with current values
                if (section === 'about') {
                    document.getElementById('aboutText').value = currentUser.bio || '';
                } else if (section === 'skillsOffered') {
                    populateSkillsCheckboxes('skillsOfferedEdit', currentUser.skillsOffered || []);
                } else if (section === 'skillsWanted') {
                    populateSkillsCheckboxes('skillsWantedEdit', currentUser.skillsWanted || []);
                } else if (section === 'availability') {
                    document.getElementById('availabilityStatus').value = currentUser.availability || 'available';
                }
            }
        }

        function populateSkillsCheckboxes(containerId, selectedSkills) {
            const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]`);
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectedSkills.includes(checkbox.value);
            });
        }

        function cancelEdit(section) {
            const displayElement = document.getElementById(section === 'about' ? 'aboutDisplay' : section + 'Display');
            const editElement = document.getElementById(section === 'about' ? 'aboutEdit' : section + 'Edit');
            
            displayElement.style.display = 'block';
            editElement.style.display = 'none';
        }

        function saveSkills(section) {
            const checkboxes = document.querySelectorAll(`#${section}Edit input[type="checkbox"]:checked`);
            const skills = Array.from(checkboxes).map(cb => cb.value);
            
            if (section === 'skillsOffered') {
                currentUser.skillsOffered = skills;
                updateSkillsDisplay('skillsOfferedDisplay', skills);
            } else {
                currentUser.skillsWanted = skills;
                updateSkillsDisplay('skillsWantedDisplay', skills, true);
            }
            
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            cancelEdit(section);
        }

        function saveAbout() {
            const bio = document.getElementById('aboutText').value;
            currentUser.bio = bio;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            document.getElementById('aboutDisplay').innerHTML = `<p class="text-white/80 leading-relaxed">${bio}</p>`;
            cancelEdit('about');
        }

        function saveAvailability() {
            const status = document.getElementById('availabilityStatus').value;
            currentUser.availability = status;
            
            const statusElement = document.getElementById('profileStatus');
            if (status === 'available') {
                statusElement.textContent = '🟢 Available for Swaps';
                statusElement.className = 'status-badge status-available';
            } else if (status === 'busy') {
                statusElement.textContent = '🟡 Busy but accepting requests';
                statusElement.className = 'status-badge status-busy';
            } else if (status === 'limited') {
                statusElement.textContent = '🟠 Limited availability';
                statusElement.className = 'status-badge status-limited';
            } else {
                statusElement.textContent = '🔴 Currently offline';
                statusElement.className = 'status-badge status-offline';
            }
            
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            cancelEdit('availability');
        }

        function saveAllChanges() {
            alert('All changes saved successfully!');
        }

        // Photo upload functionality
        document.getElementById('photoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const photoData = e.target.result;
                    
                    // Update current user data
                    currentUser.photoData = photoData;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    
                    // Update profile photo display
                    const photoElement = document.getElementById('profilePhoto');
                    const avatarElement = document.getElementById('profileAvatar');
                    
                    photoElement.style.backgroundImage = `url(${photoData})`;
                    photoElement.style.backgroundSize = 'cover';
                    photoElement.style.backgroundPosition = 'center';
                    photoElement.textContent = '';
                    
                    avatarElement.style.backgroundImage = `url(${photoData})`;
                    avatarElement.style.backgroundSize = 'cover';
                    avatarElement.style.backgroundPosition = 'center';
                    avatarElement.textContent = '';
                    
                    // Update navbar avatar if on same page
                    const navbarAvatar = document.querySelector('.navbar-avatar');
                    if (navbarAvatar) {
                        navbarAvatar.style.backgroundImage = `url(${photoData})`;
                        navbarAvatar.style.backgroundSize = 'cover';
                        navbarAvatar.style.backgroundPosition = 'center';
                        navbarAvatar.textContent = '';
                    }
                    
                    // Show success message
                    const successMsg = document.createElement('div');
                    successMsg.className = 'fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50';
                    successMsg.textContent = 'Profile photo updated successfully!';
                    document.body.appendChild(successMsg);
                    
                    setTimeout(() => {
                        successMsg.remove();
                    }, 3000);
                };
                reader.readAsDataURL(file);
            }
        });

        // Auth status check
        function checkAuthStatus() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const navAuth = document.getElementById('navAuth');
            const navGuest = document.getElementById('navGuest');
            
            if (currentUser && currentUser.isLoggedIn) {
                // User is logged in - show profile and logout
                navGuest.style.display = 'none';
                navAuth.style.display = 'block';
                
                // Update navbar with user info
                const avatarStyle = currentUser.photoData ? 
                    `style="background-image: url(${currentUser.photoData}); background-size: cover; background-position: center;"` : '';
                
                navAuth.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-400 to-pink-400 flex items-center justify-center text-white font-bold text-sm navbar-avatar" ${avatarStyle}>
                            ${currentUser.photoData ? '' : currentUser.avatar}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-white text-sm font-semibold" id="navUserName">${currentUser.firstName}</span>
                            <span class="text-cyan-400 text-xs" id="navUserStatus">${currentUser.availability || 'Available'}</span>
                        </div>
                        <button onclick="logout()" class="cyber-button text-xs px-3 py-1">
                            Logout
                        </button>
                        <a href="index.html" class="cyber-button text-xs px-3 py-1" style="background: linear-gradient(45deg, #ff6b6b, #ff8e8e);">
                            Home
                        </a>
                        <a href="admin-panel.html" class="cyber-button text-xs px-3 py-1" style="background: linear-gradient(45deg, #ffd700, #ffed4e); color: black;">
                            Admin Panel
                        </a>
                    </div>
                `;
            } else {
                // User is not logged in - show login and register
                navAuth.style.display = 'none';
                navGuest.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.reload();
        }

        function displayMySwapRequests() {
            const swapRequests = JSON.parse(localStorage.getItem('swapRequests')) || [];
            const myRequests = swapRequests.filter(req => 
                req.fromUser.name === `${currentUser.firstName} ${currentUser.lastName}` ||
                req.toUser.name === `${currentUser.firstName} ${currentUser.lastName}`
            );
            
            const swapRequestsList = document.getElementById('swapRequestsList');
            if (!swapRequestsList) return;
            
            if (myRequests.length === 0) {
                swapRequestsList.innerHTML = `
                    <div class="text-center py-8 text-white/60">
                        <div class="text-4xl mb-4">📋</div>
                        <h3 class="text-lg font-semibold mb-2">No swap requests yet</h3>
                        <p>Start connecting with other users to see your swap requests here!</p>
                    </div>
                `;
                return;
            }
            
            swapRequestsList.innerHTML = myRequests.map(request => {
                const isFromMe = request.fromUser.name === `${currentUser.firstName} ${currentUser.lastName}`;
                const otherUser = isFromMe ? request.toUser : request.fromUser;
                const statusClass = getStatusClass(request.status);
                const statusText = getStatusText(request.status);
                
                return `
                    <div class="glass p-4 rounded-lg">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="text-white font-semibold">
                                    ${isFromMe ? 'To: ' : 'From: '} ${otherUser.name}
                                </h4>
                                <p class="text-gray-400 text-sm">${new Date(request.requestDate).toLocaleDateString()}</p>
                            </div>
                            <span class="${statusClass} text-sm font-semibold">${statusText}</span>
                        </div>
                        <div class="text-sm text-gray-300 mb-3">
                            <div><strong>Skills Offered:</strong> ${request.fromUserSkills.join(', ')}</div>
                            <div><strong>Skills Wanted:</strong> ${request.toUserSkills.join(', ')}</div>
                        </div>
                        ${request.status === 'pending' && !isFromMe ? `
                            <div class="flex space-x-2">
                                <button onclick="respondToSwap('${request.id}', 'accepted')" class="px-3 py-1 bg-green-500 text-white rounded text-sm hover:bg-green-600 transition-colors">
                                    Accept
                                </button>
                                <button onclick="respondToSwap('${request.id}', 'rejected')" class="px-3 py-1 bg-red-500 text-white rounded text-sm hover:bg-red-600 transition-colors">
                                    Reject
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'pending': return 'text-yellow-400';
                case 'accepted': return 'text-green-400';
                case 'rejected': return 'text-red-400';
                case 'completed': return 'text-blue-400';
                default: return 'text-gray-400';
            }
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'pending': return '⏳ Pending';
                case 'accepted': return '✅ Accepted';
                case 'rejected': return '❌ Rejected';
                case 'completed': return '🎉 Completed';
                default: return '❓ Unknown';
            }
        }
        
        function respondToSwap(requestId, response) {
            const swapRequests = JSON.parse(localStorage.getItem('swapRequests')) || [];
            const requestIndex = swapRequests.findIndex(req => req.id == requestId);
            
            if (requestIndex !== -1) {
                swapRequests[requestIndex].status = response;
                localStorage.setItem('swapRequests', JSON.stringify(swapRequests));
                displayMySwapRequests();
                
                const successMsg = document.createElement('div');
                successMsg.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
                successMsg.textContent = `Swap request ${response}!`;
                document.body.appendChild(successMsg);
                
                setTimeout(() => {
                    successMsg.remove();
                }, 3000);
            }
        }

        // Initialize
        checkAuthStatus();
        loadMyProfile();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveAllChanges();
            }
        });
    </script>
</body>
</html>
